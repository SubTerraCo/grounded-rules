# R0 STUB — authored but not yet wired to a consumer.
# Intended consumer: BK (Blocks scripts/daily-dev-push.mjs), later ST.
# Seals the active batch and pushes the release branch onto `dev` (CI_OPS §4.1).
#
# Wire it with:
#   on:
#     schedule: [{ cron: "0 8 * * *" }]   # 02:00 America/Denver
#     workflow_dispatch:
#   jobs:
#     nightly:
#       uses: SubTerra-OS/subterra-governance/.github/workflows/nightly-dev-push.yml@v1
#       with:
#         push-script: release:nightly-push
name: Nightly dev push (reusable)

on:
  workflow_call:
    inputs:
      push-script:
        description: package.json script that performs the batch seal + push
        type: string
        default: release:nightly-push
      dry-run:
        description: Run the script in dry-run mode without pushing
        type: boolean
        default: true
      target-branch:
        description: Integration branch that receives the sealed batch
        type: string
        default: dev
      node-version:
        # pnpm 11.14 requires Node >= 22.13 — see ci-node.yml.
        type: string
        default: "22"
      pnpm-version:
        # Empty so `packageManager` in package.json wins — see ci-node.yml.
        type: string
        default: ""

env:
  CI: "true"

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "subterra-ci"
          git config user.email "ci@subterra.local"

      - name: Seal batch and push
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts?.['${{ inputs.push-script }}']?0:1)"; then
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              pnpm ${{ inputs.push-script }} -- --dry-run
            else
              pnpm ${{ inputs.push-script }}
            fi
          else
            echo "::error::script '${{ inputs.push-script }}' not found in package.json"
            exit 1
          fi
        env:
          NIGHTLY_TARGET_BRANCH: ${{ inputs.target-branch }}
