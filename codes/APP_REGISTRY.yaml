# Dewey APP segment — every app and integration reserves its own code.
# Schema: APP.PP.PR.AA.SSS.FFF
# All repos live under the SubTerraCo GitHub organization.
schemaVersion: 1
apps:
  - code: ST
    name: SubTerra Shell (admin)
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    note: "Legacy shell. The shell to build is LO Luna OS at apps/luna-os. Keep ST as an address alias."
  - code: NX
    name: Nexus
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    status: reserved
    note: "Legacy Nexus. GV-0004 replaces this with SC / apps/subterra-central. Keep NX as the address alias."
  - code: BK
    name: Blocks
    role: app
    localPath: apps/blocks
    repo: SubTerraCo/Blocks
    note: "Address alias for OD Open Day at packages/open-day."
  - code: MB
    name: Mailbot
    role: app
    localPath: apps/mailbot
    repo: SubTerraCo/mailbot
    note: "Address alias for OS Open Sort at packages/open-sort."
  - code: BB
    name: Billbot
    role: app
    localPath: packages/billbot
    status: reserved
    note: "Address alias for BI Open Bill at packages/open-bill."
  - code: GV
    name: Governance
    role: governance
    localPath: governance
    repo: SubTerraCo/subterra-governance
  - code: AT
    name: Anytype
    role: integration
    localPath: integrations/anytype
    repo: SubTerraCo/subterra-anytype
    status: linked  # GV-0001 D2 — vendor kept as `upstream` remote
    upstream: anyproto/anytype-api
    note: "Not a monorepo package. PKM lives in a dedicated Anytype workspace. any-sync ASAL limits still apply. Open Axiom is cut."
  - code: TK
    name: Subtoken
    role: app
    localPath: apps/subtoken
    repo: SubTerraCo/subtoken  # target monorepo; revival deferred (GV-0002 D6)
    status: reserved
    audience: [admin]
    note: >-
      NFC package packages/subtoken. NTAG424 challenge-response and ticket records.
      UID-only auth is forbidden. Absorbs tag-writer and validation.
      PKM stays in a dedicated Anytype workspace, not in this repo.
  - code: WL
    name: White-label OS
    role: app
    status: reserved
    note: "GV-0004: not a separate app. Commercial gate and hosting live with PoweredUpLabs on Luna OS."
  # Open names stay only where the bare name collides with a published app.
  # Luna, Central, Budget, Token, Community, Forum, Home, Media, and Bank are rewound.
  - code: LO
    name: Luna OS
    role: shell
    localPath: apps/luna-os
    status: reserved
    platforms: [DT, AD, IO, AP]
    note: "Tauri command center for Windows, macOS, Android, iOS, and Arch Linux (Omarchy). Replaces ST. The Omarchy machine is the local AI host."
  - code: LU
    name: Luna
    role: app
    localPath: packages/luna
    status: reserved
    note: "Agent router inside Luna OS. Ollama runs Gemma 4 12B on the 16GB GPU. Cloud Gemini stays available. API keys are per-user, never committed."
  - code: SC
    name: SubTerra Central
    role: shell
    localPath: apps/subterra-central
    status: reserved
    audience: [member]
    note: "Gig and event hub. Replaces NX. Anonymous NFC event page. One-time upgrade to Artist, Venue, or Vendor. Friend-show visibility is off by default. A granted Open Day schedule is public here. Wishlists and the draft stay in Open Day."
  - code: OD
    name: Open Day
    role: app
    localPath: packages/open-day
    status: reserved
    note: "Tasks, timeline, Quick Blocks, and Festy crew tools. Replaces BK as the package to build. The existing Blocks repo remains the screen spec."
  - code: OS
    name: Open Sort
    role: app
    localPath: packages/open-sort
    status: reserved
    note: "Gmail and IMAP labels and archive. Replaces MB as the package to build. A small file organizer is also named OpenSort. Code OS means this mail package."
  - code: FN
    name: Budget
    role: app
    localPath: packages/budget
    status: reserved
    note: "Budgeting only. @actual-app/api. Separate from Open Bill. The name Open Budget is already used, so this package is Budget."
  - code: BI
    name: Open Bill
    role: app
    localPath: packages/open-bill
    status: reserved
    note: "Invoicing and 1099 exports. Replaces BB as the package to build. Not Budget."
  - code: OB
    name: Open Booking
    role: app
    localPath: apps/open-booking
    status: reserved
    note: "Profile, listing, rate, and a date request. Free for a solo freelancer. A crew manager of 5 or more pays."
  - code: CH
    name: Community
    role: app
    localPath: apps/community
    status: reserved
    note: "Voting and discussion UI over Forum. Flarum, not Discourse."
  - code: FM
    name: Forum
    role: app
    localPath: packages/forum
    status: reserved
    note: "Flarum (MIT) for Community. Discourse is not the default."
  - code: HA
    name: Home Assistant
    role: app
    localPath: packages/home-assistant
    status: reserved
    audience: [admin]
    note: "Home automation client. The Home Assistant server stays upstream (Apache 2.0)."
  - code: MA
    name: Media
    role: app
    localPath: packages/media
    status: reserved
    note: "DaVinci Resolve, OBS, and Loupedeck. Rust only at the Tauri socket boundary."
  - code: BS
    name: Banking
    role: integration
    localPath: packages/banking
    status: reserved
    note: "SimpleFIN and GoCardless. Teller and Plaid are optional adapters."
