# Dewey APP segment — every app and integration reserves its own code.
# Schema: APP.PP.PR.AA.SSS.FFF
# All repos live under the SubTerraCo GitHub organization.
# GV-0004 current codes: SM, LU, SC, OT, OS, OB, BI, TK, OG, CH, FM, HA, MA, BS, GV, WL.
# Address aliases (not folders to build): ST, LO, OD, BK, MB, BB. AX is cut (Open Axiom).
# LO = former live code for SM SubTerra Metro. New work uses SM.
# OD = former live code for OT Open Time (Open Day). New work uses OT.
# Existing BK/N-#### were rewritten to OT/N-#### (PI-011 A). BK stays an alias catalog row.
schemaVersion: 1
apps:
  - code: ST
    name: SubTerra Shell (address alias)
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    note: "Leftover shell. The shell to build is SM SubTerra Metro at apps/subterra-metro. ST is an address alias. LO is the former live code, also an address alias for SM."
  - code: BK
    name: Blocks
    role: app
    localPath: apps/blocks
    repo: SubTerraCo/Blocks
    note: "Address alias for OT Open Time at packages/open-time. Existing BK/N-#### Dewey addresses were rewritten to OT/N-#### (PI-011 A)."
  - code: MB
    name: Mailbot
    role: app
    localPath: apps/mailbot
    repo: SubTerraCo/mailbot
    note: "Address alias for OS Open Sort at packages/open-sort."
  - code: BB
    name: Billbot
    role: app
    localPath: apps/billbot
    status: reserved
    note: "Address alias for BI Open Bill at packages/open-bill."
  - code: GV
    name: Grounded Rules
    role: governance
    localPath: governance
    repo: SubTerraCo/subterra-governance
    note: "Display name Grounded Rules. Live GitHub slug remains SubTerraCo/subterra-governance until Powerline Settings-renames to grounded-rules. localPath governance is the meta-workspace folder. Dewey code GV unchanged."
  - code: AT
    name: Anytype
    role: integration
    localPath: integrations/anytype
    repo: SubTerraCo/subterra-anytype
    status: linked  # GV-0001 D2 — vendor kept as `upstream` remote
    upstream: anyproto/anytype-api
    note: "Not a required monorepo package. Leftover PKM lives in a dedicated Anytype workspace. Central hosts the Anytype integration (Powerline lock 2026-09-30; Dewey role: integration only — not plugin/extension). Intended shape: Anytype / Grok bot Anytype as a Central integration. Packages-under-Central is sanctioned (GV-0004 C16). Metro↔Central data bridge allowlist includes owner-marked AT records (with OB, BI, OT). any-sync ASAL limits still apply. Open Axiom is cut."
  - code: TK
    name: Subtoken
    role: app
    localPath: packages/subtoken
    repo: SubTerraCo/subtoken  # leftover NFC repo; revival deferred (GV-0002 D6)
    status: reserved
    audience: [admin, member]
    note: >-
      ARCHITECTURE matrix: organizer tools on SubTerra Metro (admin); event page, tickets,
      show log, and digital goods on SubTerra Central (member). NFC package
      packages/subtoken. NTAG424 challenge-response. UID-only auth is forbidden.
      Absorbs leftover SubTerraCo/subtoken, tag-writer, and validation.
      PKM stays in a dedicated Anytype workspace, not in this repo.
  - code: WL
    name: White-label OS
    role: app
    status: reserved
    note: "GV-0004: not a separate app. Commercial gate and hosting live with PoweredUpLabs on SubTerra Metro."
  # Open names stay only where the bare name collides with a published app.
  # Luna, Central, Budget, Token, Community, Forum, Home, Media, and Bank are rewound.
  - code: LO
    name: SubTerra Metro (address alias)
    role: shell
    localPath: apps/subterra-metro
    status: reserved
    note: "Former live Dewey code for SubTerra Metro. Address alias for SM. New work uses SM. Do not build a second shell. Existing LO/N-#### addresses stay valid."
  - code: SM
    name: SubTerra Metro
    role: shell
    localPath: apps/subterra-metro
    status: reserved
    platforms: [DT, AD, IO, AP]
    audience: [admin]
    note: "Social media app (Powerline lock 2026-09-30). Consumes extensions and packages hosted in SubTerra Central. Tauri v2 for Windows, macOS, Android, iOS, and Arch Linux (Omarchy). Replaces ST. Former code LO is an address alias. Catalog audience admin still mounts here. The Omarchy machine is the local AI host. Personal agent Luna (LU) is unchanged."
  - code: LU
    name: Luna
    role: app
    localPath: packages/luna
    status: reserved
    note: "Agent router inside SubTerra Metro. Package and code LU are unchanged (not Metro). Ollama runs Gemma 4 12B on the 16GB GPU. Cloud Gemini stays available. API keys are per-user, never committed."
  - code: SC
    name: SubTerra Central
    role: shell
    localPath: apps/subterra-central
    status: reserved
    audience: [member]
    note: "Personal AI hub and suite of all tools (Powerline lock 2026-09-30). Hosts packages and integrations; a packages-under-Central path is sanctioned (GV-0004 C16). Offline-first PWA at apps/subterra-central. Catalog audience member still mounts here. NFC event page remains challenge-response. One-time upgrade to Artist, Venue, or Vendor. Friend-show visibility is off by default. Metro as the social app consumes packages hosted here."
  - code: OD
    name: Open Time (address alias)
    role: app
    localPath: packages/open-time
    status: reserved
    note: "Former live Dewey code for Open Time (Open Day). Address alias for OT. New work uses OT. Existing OD/N-#### addresses stay valid."
  - code: OT
    name: Open Time
    role: app
    localPath: packages/open-time
    status: reserved
    note: "Tasks, timeline, Quick Blocks, and Festy crew tools. Replaces BK as the package to build. Former code OD is an address alias. The existing Blocks repo remains the screen spec."
  - code: OS
    name: Open Sort
    role: app
    localPath: packages/open-sort
    status: reserved
    note: "Gmail and IMAP labels and archive. Replaces MB as the package to build. A small file organizer is also named OpenSort. Code OS means this mail package."
  - code: OB
    name: Open Books
    role: app
    localPath: packages/open-books
    status: reserved
    note: "Budgeting only. @actual-app/api. Replaces FN. Separate from Open Bill. Not named Open Budget."
  - code: BI
    name: Open Bill
    role: app
    localPath: packages/open-bill
    status: reserved
    note: "Invoicing and 1099 exports. Replaces BB as the package to build. Not Open Books."
  - code: OG
    name: Open Gig
    role: app
    localPath: apps/open-gig
    status: reserved
    note: "Profile, listing, rate, and a date request. Replaces BO. Free for a solo freelancer. A crew manager of 5 or more pays."
  - code: CH
    name: Community
    role: app
    localPath: apps/community
    status: reserved
    audience: [admin, member]
    note: >-
      ARCHITECTURE matrix: crew discussion on SubTerra Metro (admin); public discussion
      on SubTerra Central (member). Voting and discussion UI over Forum. Flarum,
      not Discourse.
  - code: FM
    name: Forum
    role: app
    localPath: packages/forum
    status: reserved
    note: "Flarum (MIT) for Community. Discourse is not the default."
  - code: HA
    name: Home Assistant
    role: app
    localPath: packages/home-assistant
    status: reserved
    audience: [admin]
    note: "Home automation client. The Home Assistant server stays upstream (Apache 2.0)."
  - code: MA
    name: Media
    role: app
    localPath: packages/media
    status: reserved
    note: "DaVinci Resolve, OBS, and Loupedeck. Rust only at the Tauri socket boundary."
  - code: BS
    name: Banking
    role: integration
    localPath: packages/banking
    status: reserved
    note: >-
      ARCHITECTURE matrix: SubTerra Metro only. SimpleFIN and GoCardless. Teller and
      Plaid are optional adapters. Treated as a monorepo package (marketplace: null),
      not a twin integration. Dewey `role: integration` on this registry row is
      leftover vocabulary until Powerline reclassifies it.
  - code: AX
    name: Axiom (withdrawn)
    role: app
    status: reserved
    note: "Open Axiom is cut (GV-0004). Catalog row kept until Powerline approves archive. PKM is Anytype (AT), not a monorepo package."
