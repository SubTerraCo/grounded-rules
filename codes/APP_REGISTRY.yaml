# Dewey APP segment — every app and integration reserves its own code.
# Schema: APP.PP.AA.SSS.FFF
# APP app, PP platform, AA area, SSS section, FFF feature. Seed numbers are 001.001.
# All repos live under the SubTerraCo GitHub organization.
# Current codes: MT, CT, PR, OT, OS, OB, OL, TK, OG, CM, FM, HA, MD, BK, GR, WL.
# Address aliases (not folders to build): ST, LO, SM, SC, LU, OD, BI, CH, MA, BS, GV, MB, BB. AX is cut (Open Axiom).
# LO and SC alias CT Central. SM aliases MT Metro. LU aliases PR Pepper. New work uses MT, CT, and PR.
# OD aliases OT. BI aliases OL. CH aliases CM. MA aliases MD. BS aliases BK. GV aliases GR.
# BK is Banking. Blocks has no Dewey code. Its screens live in Open Time (OT). Existing BK/N-#### Blocks addresses were rewritten to OT/N-#### (PI-011 A) before this code was reclaimed.
schemaVersion: 1
apps:
  - code: ST
    name: SubTerra Shell (address alias)
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    note: "Leftover shell. The local shell to build is CT Central at apps/central. ST is an address alias for CT."
  - code: MB
    name: Mailbot
    role: app
    localPath: apps/mailbot
    repo: SubTerraCo/mailbot
    note: "Address alias for OS Open Sort at packages/open-sort."
  - code: BB
    name: Billbot
    role: app
    localPath: apps/billbot
    status: reserved
    note: "Address alias for OL Open Bill at packages/open-bill."
  - code: GR
    name: Grounded Rules
    role: governance
    localPath: governance
    repo: SubTerraCo/grounded-rules
    note: "Display name Grounded Rules. Live GitHub slug is SubTerraCo/grounded-rules. localPath governance is the meta-workspace folder. Live Dewey code GR. Former code GV is an address alias. Design record filenames GV-000x stay as document names."
  - code: GV
    name: Grounded Rules (address alias)
    role: governance
    localPath: governance
    repo: SubTerraCo/grounded-rules
    note: "Former live code for Grounded Rules. Address alias for GR. New work uses GR."
  - code: AT
    name: Anytype
    role: integration
    localPath: integrations/anytype
    repo: SubTerraCo/subterra-anytype
    status: linked  # GV-0001 D2 — vendor kept as `upstream` remote
    upstream: anyproto/anytype-api
    note: "Not a required monorepo package. Leftover PKM lives in a dedicated Anytype workspace. Central hosts the Anytype integration (Powerline lock 2026-09-30; Dewey role: integration only — not plugin/extension). Intended shape: Anytype / Grok bot Anytype as a Central integration. Central owns the Local API client and credentials; Cara only runs Anytype desktop on 127.0.0.1:31009 (GV-0007). Packages-under-Central is sanctioned (GV-0004 C16). Metro↔Central data bridge allowlist includes owner-marked AT records (with OB, BI, OT). any-sync ASAL limits still apply. Open Axiom is cut."
  - code: TK
    name: Subtoken
    role: app
    localPath: packages/subtoken
    repo: SubTerraCo/subtoken  # leftover NFC repo; revival deferred (GV-0002 D6)
    status: reserved
    audience: [admin, member]
    note: >-
      ARCHITECTURE matrix: organizer tools on Central (admin); event page, tickets,
      show log, and digital goods on Metro (member). NFC package
      packages/subtoken. NTAG424 challenge-response. UID-only auth is forbidden.
      Absorbs leftover SubTerraCo/subtoken, tag-writer, and validation.
      PKM stays in a dedicated Anytype workspace, not in this repo.
  - code: WL
    name: White-label OS
    role: app
    status: reserved
    note: "GV-0004: not a separate app. Commercial gate and hosting live with PoweredUpLabs on Central."
  # Open names stay only where the bare name collides with a published app.
  # Pepper, Central, Budget, Token, Community, Forum, Home, Media, and Bank are rewound.
  - code: LO
    name: Central (address alias)
    role: shell
    localPath: apps/central
    status: reserved
    note: "Former live code for the local shell. Address alias for CT. New work uses CT. Existing LO/N-#### addresses stay valid."
  - code: SM
    name: Metro (address alias)
    role: shell
    localPath: apps/metro
    status: reserved
    note: "Former live code for Metro. Address alias for MT. New work uses MT."
  - code: SC
    name: Central (address alias)
    role: shell
    localPath: apps/central
    status: reserved
    note: "Former live code for Central. Address alias for CT. New work uses CT."
  - code: LU
    name: Pepper (address alias)
    role: app
    localPath: packages/pepper
    status: reserved
    note: "Former live code for Pepper. Address alias for PR. New work uses PR."
  - code: MT
    name: Metro
    role: shell
    localPath: apps/metro
    status: reserved
    audience: [member]
    note: "Public PWA. Social media and ticketing (event page, tickets, show log). Former code SM is an address alias. Catalog audience member mounts here."
  - code: CT
    name: Central
    role: shell
    localPath: apps/central
    status: reserved
    platforms: [DT, LX, AD, IO, AP]
    audience: [admin]
    note: "Local Tauri app and package host. Windows, macOS, Android, iOS, and Arch Linux (Omarchy). Replaces ST. Former codes LO and SC are address aliases. Catalog audience admin mounts here. The Omarchy machine is the local AI host."
  - code: PR
    name: Pepper
    role: app
    localPath: packages/pepper
    status: reserved
    audience: [admin]
    note: "Agent router on Central. Hermes is the runtime, not a second agent. Former code LU is an address alias. Ollama runs Gemma 4 12B on the 16GB GPU. Cloud Gemini stays available. API keys are per-user, never committed. Does not install on Metro."
  - code: OD
    name: Open Time (address alias)
    role: app
    localPath: packages/open-time
    status: reserved
    note: "Former live Dewey code for Open Time (Open Day). Address alias for OT. New work uses OT. Existing OD/N-#### addresses stay valid."
  - code: OT
    name: Open Time
    role: app
    localPath: packages/open-time
    status: reserved
    note: "Tasks, timeline, Quick Blocks, and Festy crew tools. Former code OD is an address alias. The leftover Blocks repo has no Dewey code; it remains the screen spec."
  - code: OS
    name: Open Sort
    role: app
    localPath: packages/open-sort
    status: reserved
    note: "Gmail and IMAP labels and archive. Replaces MB as the package to build. A small file organizer is also named OpenSort. Code OS means this mail package."
  - code: OB
    name: Open Books
    role: app
    localPath: packages/open-books
    status: reserved
    note: "Budgeting only. @actual-app/api. Replaces FN. Separate from Open Bill. Not named Open Budget."
  - code: OL
    name: Open Bill
    role: app
    localPath: packages/open-bill
    status: reserved
    note: "Invoicing and 1099 exports. Replaces BB as the package to build. Former code BI is an address alias. Not Open Books."
  - code: BI
    name: Open Bill (address alias)
    role: app
    localPath: packages/open-bill
    status: reserved
    note: "Former live code for Open Bill. Address alias for OL. New work uses OL."
  - code: OG
    name: Open Gig
    role: app
    localPath: packages/open-gig
    status: reserved
    note: "Profile, listing, rate, and a date request. Replaces BO. Free for a solo freelancer. A crew manager of 5 or more pays."
  - code: CM
    name: Community
    role: app
    localPath: packages/community
    status: reserved
    audience: [admin, member]
    note: >-
      Crew discussion on Central. Public discussion on Metro. Voting and
      discussion UI over Forum. Flarum, not Discourse. Former code CH is an
      address alias. CRM / Anytype object mapping is area code CR.
  - code: CH
    name: Community (address alias)
    role: app
    localPath: packages/community
    status: reserved
    note: "Former live code for Community. Address alias for CM. New work uses CM."
  - code: FM
    name: Forum
    role: app
    localPath: packages/forum
    status: reserved
    note: "Flarum (MIT) for Community. Discourse is not the default."
  - code: HA
    name: Home Assistant
    role: app
    localPath: packages/home-assistant
    status: reserved
    audience: [admin]
    note: "Home automation client. The Home Assistant server stays upstream (Apache 2.0)."
  - code: MD
    name: Media
    role: app
    localPath: packages/media
    status: reserved
    note: "DaVinci Resolve, OBS, and Loupedeck. Rust only at the Tauri socket boundary. Former code MA is an address alias. Installs on Central."
  - code: MA
    name: Media (address alias)
    role: app
    localPath: packages/media
    status: reserved
    note: "Former live code for Media. Address alias for MD. New work uses MD."
  - code: BK
    name: Banking
    role: integration
    localPath: packages/banking
    status: reserved
    note: >-
      Installs on Central. SimpleFIN and GoCardless. Teller and Plaid are
      optional adapters. Treated as a monorepo package (marketplace: null),
      not a twin integration. Dewey role integration on this row is leftover
      vocabulary until Powerline reclassifies it. Former code BS is an address
      alias. BK is not Blocks.
  - code: BS
    name: Banking (address alias)
    role: integration
    localPath: packages/banking
    status: reserved
    note: "Former live code for Banking. Address alias for BK. New work uses BK."
  - code: AX
    name: Axiom (withdrawn)
    role: app
    status: reserved
    note: "Open Axiom is cut (GV-0004 / PI-005). Remove entirely. Do not archive. PKM is Anytype (AT), not a monorepo package."
