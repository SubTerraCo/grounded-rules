# Dewey APP segment — every app and integration reserves its own code.
# Schema: APP.PP.PR.AA.SSS.FFF
# All repos live under the SubTerraCo GitHub organization.
schemaVersion: 1
apps:
  - code: ST
    name: SubTerra Shell (admin)
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    note: "Legacy shell. The shell to build is OL Open Luna at apps/open-luna. Keep ST as an address alias."
  - code: NX
    name: Nexus
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    status: reserved
    note: "Legacy Nexus. GV-0004 replaces this with SC / apps/subterra-central. Keep NX as the address alias."
  - code: BK
    name: Blocks
    role: app
    localPath: apps/blocks
    repo: SubTerraCo/Blocks
    note: "Address alias for OD Open Day at packages/open-day."
  - code: MB
    name: Mailbot
    role: app
    localPath: apps/mailbot
    repo: SubTerraCo/mailbot
    note: "Address alias for OS Open Sort at packages/open-sort."
  - code: BB
    name: Billbot
    role: app
    localPath: packages/billbot
    status: reserved
    note: "Address alias for BI Open Bill at packages/open-bill."
  - code: GV
    name: Governance
    role: governance
    localPath: governance
    repo: SubTerraCo/subterra-governance
  - code: AT
    name: Anytype
    role: integration
    localPath: integrations/anytype
    repo: SubTerraCo/subterra-anytype
    status: linked  # GV-0001 D2 — vendor kept as `upstream` remote
    upstream: anyproto/anytype-api
    note: "Optional personal hub mirror for Luna OS. Packages do not require it. The shell SQLite hub is the store when Anytype is absent. any-sync ASAL limits still apply."
  - code: TK
    name: Subtoken
    role: app
    localPath: apps/subtoken
    repo: SubTerraCo/subtoken  # target monorepo; revival deferred (GV-0002 D6)
    status: reserved
    audience: [admin]
    note: >-
      Address alias for OT Open Token at packages/open-token. UID-only auth is forbidden.
  - code: WL
    name: White-label OS
    role: app
    status: reserved
    note: "GV-0004: not a separate app. Commercial gate and hosting live with PoweredUpLabs on OL Open Luna."
  # Open-source product names. Older codes in this file stay valid as address aliases.
  - code: OL
    name: Open Luna
    role: shell
    localPath: apps/open-luna
    status: reserved
    platforms: [DT, AD, IO, AP]
    note: "Tauri command center for Windows, macOS, Android, iOS, and Arch Linux (Omarchy). Replaces ST and LO. The Omarchy machine is the local AI host."
  - code: OA
    name: Open Agent
    role: app
    localPath: packages/open-agent
    status: reserved
    note: "Agent router inside Open Luna. Ollama runs Gemma 4 12B on the 16GB GPU. Cloud Gemini stays available. Replaces LU. API keys are per-user, never committed."
  - code: OC
    name: Open Central
    role: shell
    localPath: apps/open-central
    status: reserved
    audience: [member]
    note: "Gig and event hub. Replaces SC and NX. Anonymous NFC event page. One-time upgrade to Artist, Venue, or Vendor. Friend-show visibility is off by default. A granted Open Day schedule is public here. Wishlists and the draft stay in Open Day."
  - code: OD
    name: Open Day
    role: app
    localPath: packages/open-day
    status: reserved
    note: "Tasks, timeline, Quick Blocks, and Festy crew tools. Replaces BK as the package to build. The existing Blocks repo remains the screen spec."
  - code: OS
    name: Open Sort
    role: app
    localPath: packages/open-sort
    status: reserved
    note: "Gmail and IMAP labels and archive. Replaces MB as the package to build. Code OS means Open Sort."
  - code: BG
    name: Open Budget
    role: app
    localPath: packages/open-budget
    status: reserved
    note: "Budgeting only. @actual-app/api. Replaces FN. Separate from Open Bill."
  - code: BI
    name: Open Bill
    role: app
    localPath: packages/open-bill
    status: reserved
    note: "Invoicing and 1099 exports. Replaces BB as the package to build. Not Open Budget."
  - code: OT
    name: Open Token
    role: app
    localPath: packages/open-token
    status: reserved
    note: "NFC. NTAG424 challenge-response and ticket records. Replaces TK as the package to build. Absorbs tag-writer and validation. UID-only auth is forbidden."
  - code: OB
    name: Open Booking
    role: app
    localPath: apps/open-booking
    status: reserved
    note: "Profile, listing, rate, and a date request. Replaces BO. Free for a solo freelancer. A crew manager of 5 or more pays."
  - code: CY
    name: Open Community
    role: app
    localPath: apps/open-community
    status: reserved
    note: "Voting and discussion UI over Open Forum. Replaces CH."
  - code: OF
    name: Open Forum
    role: app
    localPath: packages/open-forum
    status: reserved
    note: "Flarum (MIT) for Open Community. Replaces FM. Discourse is not the default."
  - code: OH
    name: Open Home
    role: app
    localPath: packages/open-home
    status: reserved
    audience: [admin]
    note: "Home automation client. Replaces HA. The Home Assistant server stays upstream (Apache 2.0)."
  - code: OM
    name: Open Media
    role: app
    localPath: packages/open-media
    status: reserved
    note: "DaVinci Resolve, OBS, and Loupedeck. Replaces MA. Rust only at the Tauri socket boundary."
  - code: UB
    name: Open Bank
    role: integration
    localPath: packages/open-bank
    status: reserved
    note: "SimpleFIN and GoCardless. Replaces BS. Teller and Plaid are optional adapters."
  - code: ON
    name: Open Notes
    role: integration
    localPath: packages/open-notes
    status: reserved
    note: "Optional any-sync mirror. Replaces AT as the package to build. Not required. ASAL limits still apply to any-sync."
  - code: OX
    name: Open Axiom
    role: app
    localPath: apps/open-axiom
    status: reserved
    note: "Optional isolated reader. Replaces AX. Skip unless Open Notes is not the knowledge store."
