# Dewey APP segment — every app and integration reserves its own code.
# Schema: APP.PP.PR.AA.SSS.FFF
# All repos live under the SubTerraCo GitHub organization.
schemaVersion: 1
apps:
  - code: ST
    name: SubTerra Shell (admin)
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    note: "Legacy shell. GV-0004 replaces this with LO / apps/luna-os (Tauri). Keep ST as the address alias."
  - code: NX
    name: Nexus
    role: shell
    localPath: shell
    repo: SubTerraCo/subterra-shell
    status: reserved
    note: "Legacy Nexus. GV-0004 replaces this with SC / apps/subterra-central. Keep NX as the address alias."
  - code: BK
    name: Blocks
    role: app
    localPath: apps/blocks
    repo: SubTerraCo/Blocks
    note: "Monorepo package packages/blocks. Personal kanban and timeline, plus the Festy crew tools: team setup, lobby, shift wishlist, conflict resolver, draft board, coverage, and time clock."
  - code: MB
    name: Mailbot
    role: app
    localPath: apps/mailbot
    repo: SubTerraCo/mailbot
    note: "Monorepo package packages/mailbot. Code stays MB."
  - code: BB
    name: Billbot
    role: app
    localPath: packages/billbot
    status: reserved
    note: "GV-0004 keeps this name and code. Package path is packages/billbot. Do not absorb InvoiceShelf (AGPL) into this package."
  - code: GV
    name: Governance
    role: governance
    localPath: governance
    repo: SubTerraCo/subterra-governance
  - code: AT
    name: Anytype
    role: integration
    localPath: integrations/anytype
    repo: SubTerraCo/subterra-anytype
    status: linked  # GV-0001 D2 — vendor kept as `upstream` remote
    upstream: anyproto/anytype-api
    note: "Optional personal hub mirror for Luna OS. Packages do not require it. The shell SQLite hub is the store when Anytype is absent. any-sync ASAL limits still apply."
  - code: TK
    name: Subtoken
    role: app
    localPath: apps/subtoken
    repo: SubTerraCo/subtoken  # target monorepo; revival deferred (GV-0002 D6)
    status: reserved
    audience: [admin]
    note: >-
      Monorepo package packages/subtoken. Code stays TK. NTAG424 challenge-response
      and Solana ticket signatures live here. UID-only auth is forbidden.
      Absorbs tag-writer and validation.
  - code: WL
    name: White-label OS
    role: app
    status: reserved
    note: "GV-0004: not a separate app. Commercial gate and hosting live with PoweredUpLabs on LO Luna OS."
  # GV-0004 enterprise monorepo. Old codes above remain valid addresses.
  - code: LO
    name: Luna OS
    role: shell
    localPath: apps/luna-os
    status: reserved
    platforms: [DT, AD, IO, AP]
    note: "Tauri v2 command center for Windows, macOS, Android, iOS, and Arch Linux (Omarchy). Replaces ST. The Omarchy machine is the local AI host."
  - code: SC
    name: SubTerra Central
    role: shell
    localPath: apps/subterra-central
    status: reserved
    audience: [member]
    note: "Gig and event hub. Anonymous NFC event page, tickets, show log, and follows. One-time upgrade to Artist, Venue, or Vendor. Friend-show visibility is off by default. A granted Blocks schedule is public here. Wishlists, the draft, and the time clock stay in Blocks. Finance and time cross the Luna OS bridge only when that owner links them."
  - code: BO
    name: Booking
    role: app
    localPath: apps/booking
    status: reserved
    note: "Profile, listing, rate, and a date request. Free for a solo freelancer. A crew manager of 5 or more pays. Not the day planner (BK) and not invoicing (BB)."
  - code: AX
    name: Axiom
    role: app
    localPath: apps/axiom
    status: reserved
    note: "Optional isolated reader. Not required while Anytype holds the knowledge graph. No read path to LO or SC data."
  - code: CH
    name: Community
    role: app
    localPath: apps/community
    status: reserved
    note: "Voting and discussion UI over FM. Flarum, not Discourse."
  - code: FN
    name: Budget
    role: app
    localPath: packages/budget
    status: reserved
    note: "Budgeting only. Headless wrapper around @actual-app/api. Separate from BB Billbot. Actual's UI stays upstream."
  - code: LU
    name: Luna
    role: app
    localPath: packages/luna
    status: reserved
    note: "Agent router inside Luna OS. Ollama on the Omarchy host runs Gemma 4 12B by default on a 16GB GPU. Cloud Gemini stays available. API keys are per-user, never committed."
  - code: BS
    name: Banking
    role: integration
    localPath: packages/banking
    status: reserved
    note: "SimpleFIN and GoCardless first. Teller and Plaid are optional adapters behind the same interface."
  - code: FM
    name: Forum
    role: app
    localPath: packages/forum
    status: reserved
    note: "Topic voting and discussion logic for CH. Flarum (MIT). Discourse is not the default."
  - code: MA
    name: Media
    role: app
    localPath: packages/media
    status: reserved
    note: "Show production. Talks to DaVinci Resolve, OBS, and Loupedeck. Rust only at the Tauri socket boundary."
  - code: HA
    name: Home Assistant
    role: app
    localPath: packages/home-assistant
    status: reserved
    audience: [admin]
    note: "Home automation client. The Home Assistant server stays upstream (Apache 2.0) and can run on the Omarchy host. This package talks to it. It is not vendored into BSL."
