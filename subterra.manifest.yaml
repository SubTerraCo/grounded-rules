schemaVersion: 1
# Top-level key `governance:` is the catalog schema (not the product display name).
# Display product/repo name: Grounded Rules. Live GitHub slug remains SubTerraCo/subterra-governance
# until Powerline Settings-renames to grounded-rules.
governance:
  repo: SubTerraCo/subterra-governance
  ciOpsVersion: "26.8.4"
  addressScheme: "APP.PP.PR.AA.SSS.FFF"

  owner: SubTerraCo
  ownerType: organization
  productionBranch: master
  orgMigration:
    status: complete
    completedOn: "2026-08-04"
    note: >-
      All five SubTerra repos were transferred from the `PoweredUpLabs` personal
      user account into the SubTerraCo org. GitHub keeps redirects from the old
      paths, but every ref here and in workflows points at SubTerraCo directly.
    plan: team  # upgraded 2026-08-04
    planIsRequired: >-
      Team is a hard dependency, not a convenience: reusable workflows in PRIVATE
      repos do not run on Free (they fail as startup_failure with no log). The
      whole reusable-pipeline layer breaks on downgrade. See GV-0001 §6.
    protection: >-
      All five product repos carry a `master protection` ruleset (deletion,
      non_fast_forward, required_status_checks) with org admins as bypass actors.
    legacyOwner: PoweredUpLabs  # still holds unrelated repos; nothing SubTerra should live there

# Canonical catalog. GV-0004 product shape: SubTerra Metro + SubTerra Central + standalone packages.
# Leftover standalone-repo items stay as address aliases until folded into SubTerraCo/luna.
#
# audience (GV-0002 D4): list of catalog audiences that may mount the item.
# Locked machine values: admin | member only. Do not rename these strings.
# Default when omitted: [admin] (fail-closed).
# Mapping: admin → SubTerra Metro (SM, apps/subterra-metro; aliases LO, ST);
#          member → SubTerra Central (SC, apps/subterra-central).
# No third audience. Never reuse the word `role` for this — leftover twin role is deprecated.
#
# Twin fields (role: app|integration, marketplace: apps|integrations, @subterra/*-sdk):
# DEPRECATED on leftover standalone repos. Do not write them on new monorepo catalog items.
# Monorepo packages use marketplace: null, no twin SDK, and audience as the live mount gate.
items:
  - id: shell
    appCode: ST
    name: SubTerra Shell
    repo: SubTerraCo/subterra-shell
    localPath: shell
    platforms: [DT, WB, AD]
    role: shell
    marketplace: null
    audience: [admin]
    defaultOpen: false
    sdk: null
    status: linked  # first consumer of the reusable ci-node workflow
    note: "Address alias for SM SubTerra Metro (former live code LO). Leftover SubTerraCo/subterra-shell until Phase 1. Twin SDK packages below are deprecated leftover until fold-in."
    provides:
      # Twin SDKs scaffolded and parity-verified (GV-0001 D10). Deprecated leftover surface.
      - "@subterra/sdk-contract"   # internal single source of truth
      - "@subterra/app-sdk"
      - "@subterra/integration-sdk"

  - id: blocks
    appCode: BK
    name: Blocks
    repo: SubTerraCo/Blocks
    localPath: apps/blocks
    platforms: [DT, WB, AD, IO]
    role: app  # DEPRECATED leftover twin field
    marketplace: apps  # DEPRECATED leftover twin field
    audience: [admin]
    defaultOpen: true
    sdk: "@subterra/app-sdk"  # DEPRECATED leftover twin field
    mcp: "@blocks/mcp-server"
    status: linked
    note: "Address alias for OT Open Time at packages/open-time. Existing BK/N-#### Dewey addresses were rewritten to OT/N-#### (PI-011 A). Twin role/marketplace/sdk fields are deprecated leftover until fold-in."

  - id: mailbot
    appCode: MB
    name: Mailbot
    repo: SubTerraCo/mailbot
    localPath: apps/mailbot
    platforms: [WB, DT]
    role: app  # DEPRECATED leftover twin field
    marketplace: apps  # DEPRECATED leftover twin field
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/app-sdk"  # DEPRECATED leftover twin field
    # Remote repointed off the dead `poweredupbass` handle; local and remote
    # HEAD verified identical (dd1ddaa) before the org transfer.
    status: linked
    defaultBranch: master
    note: "Address alias for OS Open Sort at packages/open-sort. Twin role/marketplace/sdk fields are deprecated leftover until fold-in."

  - id: billbot
    appCode: BB
    name: Billbot
    repo: SubTerraCo/billbot
    localPath: apps/billbot
    platforms: [WB, DT]
    role: app  # DEPRECATED leftover twin field
    marketplace: apps  # DEPRECATED leftover twin field
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/app-sdk"  # DEPRECATED leftover twin field
    status: reserved
    note: "Address alias for BI Open Bill at packages/open-bill. Twin role/marketplace/sdk fields are deprecated leftover until fold-in."

  - id: anytype
    appCode: AT
    name: Anytype
    repo: SubTerraCo/subterra-anytype
    localPath: integrations/anytype
    platforms: [SH, MC]
    role: integration  # DEPRECATED leftover twin field
    marketplace: integrations  # DEPRECATED leftover twin field
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/integration-sdk"  # DEPRECATED leftover twin field
    # GV-0001 D2/D8: our own repo, seeded by pushing local history as-is.
    # The vendor SDK stays a separate `upstream` remote — never `origin`.
    status: linked  # origin is ours, vendor SDK stays on the `upstream` remote
    upstream: anyproto/anytype-api
    legacyRepo: SubTerraCo/anytype-google-contact-integration  # superseded predecessor, kept for reference
    defaultBranch: master
    note: "PKM is a dedicated Anytype workspace (not a PKM packages/* product). Twin role/marketplace/sdk fields are deprecated leftover until fold-in. Grok bot Anytype is the Central-owned Local API integration under AT (classification integration only). Cara only runs Anytype desktop on 127.0.0.1:31009. Bridge allowlist OB+BI+OT+AT."

