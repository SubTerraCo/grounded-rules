schemaVersion: 1
governance:
  repo: SubTerraCo/subterra-governance
  ciOpsVersion: "26.8.4"
  addressScheme: "APP.PP.PR.AA.SSS.FFF"

  owner: SubTerraCo
  ownerType: organization
  productionBranch: master
  orgMigration:
    status: complete
    completedOn: "2026-08-04"
    note: >-
      All five SubTerra repos were transferred from the `PoweredUpLabs` personal
      user account into the SubTerraCo org. GitHub keeps redirects from the old
      paths, but every ref here and in workflows points at SubTerraCo directly.
    plan: team  # upgraded 2026-08-04
    planIsRequired: >-
      Team is a hard dependency, not a convenience: reusable workflows in PRIVATE
      repos do not run on Free (they fail as startup_failure with no log). The
      whole reusable-pipeline layer breaks on downgrade. See GV-0001 §6.
    protection: >-
      All five product repos carry a `master protection` ruleset (deletion,
      non_fast_forward, required_status_checks) with org admins as bypass actors.
    legacyOwner: PoweredUpLabs  # still holds unrelated repos; nothing SubTerra should live there

# Canonical catalog. GV-0004 product shape: Luna OS + SubTerra Central + standalone packages.
# Leftover standalone-repo items stay as address aliases until folded into SubTerraCo/luna.
#
# audience (GV-0002 D4): list of shell audiences that may mount the item.
# Values: admin | member. Default when omitted: [admin] (fail-closed).
# Typical shells: Luna OS (admin), SubTerra Central (member).
# Never reuse the word `role` for this — role is app vs integration (legacy shell) or catalog kind.
items:
  - id: shell
    appCode: ST
    name: SubTerra Shell
    repo: SubTerraCo/subterra-shell
    localPath: shell
    platforms: [DT, WB, AD]
    role: shell
    marketplace: null
    audience: [admin]
    defaultOpen: false
    sdk: null
    status: linked  # first consumer of the reusable ci-node workflow
    note: "Address alias for LO Luna OS. Leftover SubTerraCo/subterra-shell until Phase 1. Do not build leftover apps/admin folders or packages/shell-core."
    provides:
      # Twin SDKs scaffolded and parity-verified (GV-0001 D10).
      - "@subterra/sdk-contract"   # internal single source of truth
      - "@subterra/app-sdk"
      - "@subterra/integration-sdk"

  - id: blocks
    appCode: BK
    name: Blocks
    repo: SubTerraCo/Blocks
    localPath: apps/blocks
    platforms: [DT, WB, AD, IO]
    role: app
    marketplace: apps
    audience: [admin]
    defaultOpen: true
    sdk: "@subterra/app-sdk"
    mcp: "@blocks/mcp-server"
    status: linked
    note: "Address alias for OD Open Day at packages/open-day. Existing Blocks repo remains the screen spec until fold-in."

  - id: mailbot
    appCode: MB
    name: Mailbot
    repo: SubTerraCo/mailbot
    localPath: apps/mailbot
    platforms: [WB, DT]
    role: app
    marketplace: apps
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/app-sdk"
    # Remote repointed off the dead `poweredupbass` handle; local and remote
    # HEAD verified identical (dd1ddaa) before the org transfer.
    status: linked
    defaultBranch: master
    note: "Address alias for OS Open Sort at packages/open-sort."

  - id: billbot
    appCode: BB
    name: Billbot
    repo: SubTerraCo/billbot
    localPath: apps/billbot
    platforms: [WB, DT]
    role: app
    marketplace: apps
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/app-sdk"
    status: reserved
    note: "Address alias for BI Open Bill at packages/open-bill."

  - id: subtoken
    appCode: TK
    name: Subtoken
    repo: SubTerraCo/subtoken
    localPath: packages/subtoken
    platforms: [DT, WB, AD, IO]
    role: app
    marketplace: apps
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/app-sdk"
    status: reserved  # revival deferred (GV-0002 D6 / D8)
    note: >-
      Admin NFC / ticketing. Absorbs SubTerraCo/subtoken, tag-writer, and
      validation. Challenge-response auth crypto becomes shared (§13).

  - id: anytype
    appCode: AT
    name: Anytype
    repo: SubTerraCo/subterra-anytype
    localPath: integrations/anytype
    platforms: [SH, MC]
    role: integration
    marketplace: integrations
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/integration-sdk"
    # GV-0001 D2/D8: our own repo, seeded by pushing local history as-is.
    # The vendor SDK stays a separate `upstream` remote — never `origin`.
    status: linked  # origin is ours, vendor SDK stays on the `upstream` remote
    upstream: anyproto/anytype-api
    legacyRepo: SubTerraCo/anytype-google-contact-integration  # superseded predecessor, kept for reference
    defaultBranch: master

  # GV-0004 monorepo entry points. Repo is not created yet. Old items above stay as aliases.
  - id: luna-os
    appCode: LO
    name: Luna OS
    repo: null
    localPath: apps/luna-os
    platforms: [DT, AD, IO, AP]
    role: shell
    marketplace: null
    audience: [admin]
    defaultOpen: false
    sdk: null
    status: reserved
    note: "GV-0004. Tauri command center, including Arch Linux for Omarchy. Replaces ST. Personal data is isolated from SC."

  - id: subterra-central
    appCode: SC
    name: SubTerra Central
    repo: null
    localPath: apps/subterra-central
    platforms: [WB]
    role: shell
    marketplace: null
    audience: [member]
    defaultOpen: false
    sdk: null
    status: reserved
    note: "Gig and event hub. Anonymous NFC event page. One-time Artist, Venue, or Vendor upgrade. Friend visibility off by default."

  - id: open-gig
    appCode: OG
