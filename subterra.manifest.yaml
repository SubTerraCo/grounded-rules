    status: reserved

  - id: community-hub
    appCode: CH
    name: Community
    repo: null
    localPath: apps/community
    platforms: [WB]
    role: app
    marketplace: apps
    audience: [member]
    defaultOpen: false
    sdk: "@subterra/app-sdk"
