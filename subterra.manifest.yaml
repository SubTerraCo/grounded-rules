  - id: budget
    appCode: FN
    name: Budget
    repo: null
    localPath: packages/budget
    platforms: [SB]
    role: app
    marketplace: apps
    audience: [admin]
    defaultOpen: false
    sdk: "@subterra/app-sdk"
    status: reserved
    note: "Budgeting only. Wraps @actual-app/api. Separate from BB Billbot. Upstream fork stays actual-budget-master-fork."
